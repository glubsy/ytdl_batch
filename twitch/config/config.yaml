# Twitch rename VODs configuration file
# Each entry corresponds to a single Twitch channel with its associated metadata.
# Multiple entries can share the same directory_name if files from different channels
# are stored in the same directory.
# Fields:
#   directory_name: The local directory name where the channel's VODs are stored.
#                   This must match the directory structure used in your file system.
#   author_name: A list of possible author names that appear in filenames for this channel.
#                These must match the author names used in your video filenames.
#   channel_id: The single Twitch channel ID for this entry.
#               This is used to fetch the correct VOD information from Twitch API.
#   title_overrides: (Optional) List of strings to remove from video titles.
#                    Strings containing {{ }} are treated as regex patterns.
#                    Example: "day {{ \\\\d+ }}" matches "day 59"

